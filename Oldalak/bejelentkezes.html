<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllNightSnack - Bejelentkezés</title>
    <!-- A közös fő stíluslap elérése a mappából kilépve -->
    <link rel="stylesheet" href="../ANS.css">
</head>
<body>

    <!-- Központi tároló a kezdőmenühöz hasonlóan -->
    <main class="welcome-container">

        <header>
            <!-- Javított logó útvonal -->
            <img src="../Alapkepek/ANS_logo.png" alt="LOGO" class="logo">
            <h1>AllNightSnack</h1>
            <h4>„Hajnali éhség? AllNightSnack!”</h4>
        </header>

        <!-- Bejelentkező kártya az űrlapnak -->
        <section class="auth-card">
            <h2>Bejelentkezés</h2>

            <form action="main_menu.html" method="GET" class="auth-form">

                <div class="input-group">
                    <label for="email">E-mail cím</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Írd ide az e-mail címed..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Jelszó</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Írd be a jelszavad..."
                        required
                    >
                </div>

                <!-- Belépés gomb a sárga elsődleges gomb stílusával -->
                <button type="submit" class="auth-btn auth-btn-primary">Bejelentkezés</button>

            </form>

            <!-- Visszalépési link a regisztrációhoz vagy a kezdőmenühöz -->
            <p class="auth-footer-text">
                Még nincs fiókod? 
                <a href="reg2.html">Regisztráció</a>
            </p>
            <p class="auth-footer-text">
                <a href="kezdomenu.html">← Vissza a kezdőlapra</a>
            </p>
        </section>

    </main>

</body>
</html>
