<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AllNightSnack - Regisztráció</title>
    <!-- A közös fő stíluslap elérése a mappából kilépve -->
    <link rel="stylesheet" href="../ANS.css">
</head>
<body>

    <!-- Központi tároló az egységes kinézethez -->
    <main class="welcome-container">

        <header>
            <!-- Javított logó útvonal -->
            <img src="../Alapkepek/ANS_logo.png" alt="LOGO" class="logo">
            <h1>AllNightSnack</h1>
            <h4>„Hajnali éhség? AllNightSnack!”</h4>
        </header>

        <!-- Regisztrációs kártya az űrlapnak -->
        <section class="auth-card">
            <h2>Regisztráció</h2>

            <form action="bejelentkezes.html" method="GET" class="auth-form">

                <div class="input-group">
                    <label for="name">Név</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Írd ide a neved..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">E-mail cím</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Írd ide az e-mail címed..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Jelszó</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Írd be a jelszót..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password2">Jelszó újra</label>
                    <input
                        type="password"
                        id="password2"
                        placeholder="Írd be újra a jelszavad..."
                        required
                    >
                </div>

                <!-- Regisztráció gomb a sárga elsődleges gomb stílusával -->
                <button type="submit" class="auth-btn auth-btn-primary">Regisztráció</button>
            
            </form>

            <!-- Alsó navigációs linkek -->
            <p class="auth-footer-text">
                Már van fiókod? 
                <a href="bejelentkezes.html">Bejelentkezés</a>
            </p>
            <p class="auth-footer-text">
                <a href="kezdomenu.html">← Vissza a kezdőlapra</a>
            </p>
        </section>

    </main>

</body>
</html>
