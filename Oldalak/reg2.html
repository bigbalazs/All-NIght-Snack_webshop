<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AllNightSnack - Regisztráció</title>

    <link rel="stylesheet" href="regcss.css">
</head>

<body>

    <div class="container">

        <div class="register-box">

            <!-- LOGÓ -->
            <div class="logo-container">
                <img src="ChatGPT Image 2026. szept. 10. 09_26_39.png" alt="AllNightSnack logo">
            </div>

            <h1>AllNightSnack</h1>

            <p class="slogan">
                „Hajnali éhség? AllNightSnack!”
            </p>

            <h2>Regisztráció</h2>

            <!-- A REJTETT FORM TAG PÓTLÁSA ÉS AZ ÁTIRÁNYÍTÁS -->
            <form action="bejelentkezes.html" method="GET">

                <div class="input-group">
                    <label for="name">Név</label>
                    <input
                        type="text"
                        id="name"
                        placeholder="Írd ide a neved..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="Írd ide az e-mail címed..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password">Jelszó</label>
                    <input
                        type="password"
                        id="password"
                        placeholder="Írd be a jelszót..."
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="password2">Jelszó újra</label>
                    <input
                        type="password"
                        id="password2"
                        placeholder="Írd be újra a jelszavad..."
                        required
                    >
                </div>

                <button type="submit">Regisztráció</button>
            
            </form>

            <p class="login-text">
                Már van fiókod?
                <a href="bejelentkezes.html">Bejelentkezés</a>
            </p>

        </div>

    </div>

</body>
</html>
